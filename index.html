<style>

.field-shell{margin-top:10px;background:#fff;border-radius:25px;padding:9px;box-shadow:var(--shadow)}.field{aspect-ratio:10/12.6;border-radius:20px;position:relative;overflow:hidden;background:repeating-linear-gradient(0deg,var(--field) 0,var(--field) 9.5%,var(--field2) 9.5%,var(--field2) 10%);border:4px solid #fff;box-shadow:inset 0 0 0 2px #ffffff55;touch-action:manipulation}.field:before{content:"";position:absolute;inset:4% 7%;border:2px solid #ffffffaa;border-top:0;border-bottom:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 9.7%,#ffffffaa 9.7%,#ffffffaa 10.2%);pointer-events:none}.los,.gain{position:absolute;left:7%;right:7%;height:4px;z-index:1}.los{bottom:31%;background:#3f9cff}.gain{bottom:57%;background:#f4d93a}.field-instruction{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:#142018d9;color:white;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:950;z-index:20;white-space:nowrap}.player-dot{--dot-r:27px;position:absolute;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:1000;z-index:6;border:4px solid #fff;box-shadow:0 4px 10px #0004;transition:left .45s ease,top .45s ease,transform .25s,opacity .2s;background:#fff;color:var(--team)}button.player-dot{padding:0}.player-dot.me{background:var(--team);color:#fff;border-color:var(--team2)}.player-dot.team{background:#fff;color:var(--team);border-color:var(--team2)}.player-dot.def{background:#d44358;color:white;border-color:#fff}.player-dot.glow{animation:pulse 1.05s infinite}.player-dot.dim{opacity:.45}.player-label{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;border-radius:8px;padding:2px 6px;font-size:10px;white-space:nowrap}.ball{position:absolute;font-size:25px;z-index:9;transition:left .4s ease,top .4s ease,transform .25s}.spot{position:absolute;width:82px;height:82px;border-radius:50%;border:5px dashed #ffe276;background:#ffe27633;transform:translate(-50%,-50%);z- /* ===== Responsive audit pass: mobile-first scale + readability ===== */
:root{
  --page-pad:clamp(12px,3.8vw,24px);
  --tap:48px;
  --text-xs:clamp(11px,2.8vw,12px);
  --text-sm:clamp(13px,3.2vw,14px);
  --text-md:clamp(15px,3.8vw,17px);
  --text-lg:clamp(18px,4.7vw,22px);
  --text-xl:clamp(28px,8vw,38px);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:16px;line-height:1.35}
.app{width:100%;max-width:1040px}
.screen{padding:16px var(--page-pad) calc(92px + env(safe-area-inset-bottom))}
.topbar{min-height:64px;height:auto;padding:10px var(--page-pad)}
.logo{width:44px;height:44px;font-size:25px}
.brand-mini strong{font-size:14px;line-height:1.15}.brand-mini span{font-size:12px;line-height:1.2}
.icon-btn,.btn,.back,.stage-tab,.nav-btn,.action-key{min-height:var(--tap)}
.icon-btn{min-width:var(--tap);height:var(--tap);font-size:22px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--team2);outline-offset:3px}
.hero{padding:20px 18px;border-radius:24px}.hero .logo{width:64px;height:64px;font-size:36px}
.hero h1{font-size:clamp(23px,6vw,30px);line-height:1.05}.hero p{font-size:var(--text-sm)}
.eyebrow{font-size:12px}.greeting{margin-top:18px}.greeting h2{font-size:var(--text-xl);line-height:1.02}.greeting p{font-size:var(--text-sm)}
.section-title{font-size:12px;line-height:1.3;margin-top:20px}
.big-grid{gap:12px}.big-choice{min-height:84px;padding:15px 16px;border-radius:20px;gap:14px}
.big-choice .emoji{width:52px;height:52px;font-size:30px;border-radius:16px;flex:none}.big-choice b{font-size:var(--text-lg);line-height:1.1}.big-choice small{font-size:var(--text-sm);line-height:1.25}
.player-card{min-height:88px;padding:12px 13px}.jersey{width:62px;height:68px;font-size:23px}.player-card h3{font-size:20px}.player-card p{font-size:14px;line-height:1.25}
.play-card{padding:14px}.play-card h3{font-size:18px;line-height:1.2}.play-card p{font-size:14px;line-height:1.35}.stars{font-size:16px;letter-spacing:1px}
.btn{padding:12px 16px;font-size:15px}.btn.wide{font-size:18px;min-height:58px}
.back{padding:10px 6px;font-size:16px}
.stage-tabs{gap:8px}.stage-tab{padding:10px 6px;font-size:12px;line-height:1.15}
.coach-bubble{padding:14px 15px}.coach-bubble .say{font-size:clamp(19px,5vw,24px);line-height:1.18}.coach-bubble small,.coach-bubble .sub{font-size:13px;line-height:1.35}
.notice,.feedback,.control-note{font-size:14px;line-height:1.35}

/* Field: readable on phones, intentionally capped on larger screens */
.field-shell{width:100%;max-width:660px;margin:10px auto 0;padding:8px;border-radius:22px}
.field{width:100%;aspect-ratio:10/12.25;border-width:3px;border-radius:18px}
.field-instruction{top:3%;max-width:82%;white-space:normal;text-align:center;padding:7px 10px;font-size:12px;line-height:1.15}
.player-dot{width:54px;height:54px;border-width:4px;font-size:16px}
.player-label{top:55px;font-size:11px;line-height:1.1;padding:3px 6px}
.ball{font-size:27px}.spot{width:84px;height:84px}.decision{min-width:92px;min-height:58px;font-size:13px;line-height:1.1}
.live-target{width:76px;height:76px}.live-clock{font-size:12px}.live-coach{font-size:12px;line-height:1.2;max-width:70%}
.demo-status{font-size:14px;line-height:1.2;padding:11px 12px}.guided-card b{font-size:16px}.guided-card span{font-size:13px}

/* Analog control: left-handed placement by layout; consistent physical size */
.control-wrap{max-width:660px;margin:12px auto 0;grid-template-columns:minmax(138px,156px) minmax(0,1fr);gap:12px;align-items:center}
.thumbstick{width:148px;height:148px}.stick-knob{width:68px;height:68px}.stick-label{font-size:12px}.control-note{padding:12px}.control-note strong{font-size:16px;line-height:1.2}.action-key{font-size:14px;min-height:50px;padding:12px 14px}

.hud{max-width:660px;margin-left:auto;margin-right:auto;padding:10px 12px}.hud .score{font-size:20px}.hud .mid{font-size:12px}.drivebar,.football-fieldline,.yard-result{max-width:660px;margin-left:auto;margin-right:auto}
.result-chip{font-size:12px;line-height:1.15}
.bottom-nav{width:min(1040px,100%);height:calc(74px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{font-size:12px;line-height:1.05;padding:5px 2px}.nav-btn span{font-size:24px;line-height:1;margin-bottom:3px}

/* Small phones: 320–390 */
@media(max-width:390px){
  :root{--page-pad:12px;--tap:48px}
  .topbar{padding-top:8px;padding-bottom:8px}.brand-mini{gap:8px}.brand-mini span{font-size:11px}
  .hero{padding:17px 15px;border-radius:21px}.hero-team{gap:11px}.hero .logo{width:56px;height:56px;font-size:31px}.hero h1{font-size:22px}.greeting h2{font-size:29px}

/* === Local Product Studio UX audit pass ===
   Priorities: current task > field/simulation > active control > supporting UI.
   Behavioral code is intentionally untouched in this pass. */
:root{
  --ux-tap:48px;
  --ux-focus:0 0 0 4px color-mix(in srgb,var(--team2) 35%,transparent);
  --ux-fast:140ms;
  --ux-normal:220ms;
}

/* Reliable, obvious controls */
button{
  font-family:inherit;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:focus-visible,[tabindex]:focus-visible{
  outline:3px solid var(--team2);
  outline-offset:3px;
  box-shadow:var(--ux-focus);
}
@media(pointer:coarse){
  button:not(.nav-btn){min-height:var(--ux-tap)}
}

/* Primary choices get stronger hierarchy; secondary copy gets quieter. */
.big-choice{
  border:2px solid rgba(68,48,96,.07);
  transition:transform var(--ux-fast) ease,box-shadow var(--ux-fast) ease,border-color var(--ux-fast) ease;
}
.big-choice b{letter-spacing:-.015em}
.big-choice small{line-height:1.3}
@media(hover:hover) and (pointer:fine){
  .big-choice:hover{transform:translateY(-2px);box-shadow:0 11px 27px #25304a1c;border-color:rgba(68,48,96,.15)}
}

/* Coaching instruction reads before decorative/status content. */
.coach-bubble{
  border:2px solid color-mix(in srgb,var(--team2) 30%,#fff);
  box-shadow:0 7px 22px rgba(34,25,54,.08);
}
.coach-bubble .say{
  letter-spacing:-.02em;
  text-wrap:balance;
}

/* Make the field feel like the primary surface rather than one card among many. */
.field-shell{
  box-shadow:0 10px 30px rgba(20,31,24,.13);
}
.field{
  isolation:isolate;
}
.player-dot.me{
  box-shadow:
    0 0 0 4px color-mix(in srgb,var(--team2) 72%,#fff),
    0 6px 15px rgba(0,0,0,.30);
}
.player-dot.me::after{
  content:"YOU";
  position:absolute;
  left:50%;
  bottom:calc(100% + 5px);
  transform:translateX(-50%);
  background:#fff;
  color:#241b2e;
  border:2px solid var(--team2);
  border-radius:999px;
  padding:2px 6px;
  font-size:8px;
  font-weight:1000;
  letter-spacing:.08em;
  line-height:1.1;
  white-space:nowrap;
  pointer-events:none;
}

/* The thumb stick is the dominant context tool during live movement. */
.thumbstick{
  box-shadow:
    inset 0 0 0 3px #1117,

.stick-knob{

    inset 0 2px 8px rgba(255,255,255,.35),

    0 5px 12px rgba(0,0,0,.28);
}
.stick-label{

  font-weight:1000;
}

  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:6px 4px;

.btn,.big-choice,.stage-choice,.mobile-home-btn,.mobile-sound-btn,.action-key{

}
.btn:active:not(:disabled),.big-choice:active:not(:disabled),.stage-choice:active:not(:disabled),
.mobile-home-btn:active,.mobile-sound-btn:active,.action-key:active:not(:disabled){

/* Player tokens: depth, ground shadow feel, and helmet shine without SVG rewrites. */
.player-dot{
  background:radial-gradient(circle at 34% 26%,#ffffff 0 18%,#e8eefc 19% 42%,#cbd8ee 100%);
  box-shadow:0 7px 5px -4px rgba(4,20,10,.34),0 3px 9px rgba(0,0,0,.2);

function ordinal(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':'4TH'}

 g.result={yards,first,td,turnover,opponent,jobScore:execution,blockWon,defense,msg:!logicCheck.ok?'The play has an uncovered defensive responsibility. Coach should fix the play logic.':success?(execution===3?'You moved through the assignment cleanly.':'You got to the right football job.'):'The play kept moving. Practice the assignment and try again.'};g.state='RESULT';g.execution=null;runtime.live=null;render();speak(g.result.msg+(first?' First down!':'')+(td?' Touchdown!':''))}
function simulateOpponent(){const code=(state.game.drive*7+state.game.us+state.game.them)%5;if(code===0){state.game.them+=6;return'Bears score a touchdown (+6).'}if(code===1){state.game.them+=3;return'Bears kick a field goal (+3).'}return'Your defense gets the stop.'}

function syncPlayViewport(){
 const vv=window.visualViewport;
 const inner=Math.round(window.innerHeight||document.documentElement.clientHeight||0);
 const visual=Math.round(vv?.height||inner);
 const raw=Math.max(0,Math.min(inner||visual,visual||inner));
 const mobile=window.matchMedia('(max-width:600px) and (pointer:coarse)').matches;
 // Protect the final control strip from Android browser chrome. Using the smaller
 // viewport measurement and not reacting to toolbar scroll prevents resize flicker.
 const reserve=mobile?68:0;
 const h=Math.max(420,raw-reserve);
 if(Math.abs(h-(runtime.lastPlayViewport||0))<6)return;
 runtime.lastPlayViewport=h;
 document.documentElement.style.setProperty('--play-vh',h+'px');
 document.documentElement.style.setProperty('--play-field-max',Math.max(260,Math.min(430,Math.round(h*.60)))+'px');
 document.documentElement.style.setProperty('--play-field-live-max',Math.max(215,Math.min(338,Math.round(h*.46)))+'px');
 document.body?.classList.toggle('play-short',mobile&&h<620);
 queueCircleAudit('viewport')
}

function auditCircleGeometry(source='render'){
  const nodes=[...document.querySelectorAll('.player-dot,.mobile-home-btn,.mobile-sound-btn,.logo')];
  for(const el of nodes){
    const r=el.getBoundingClientRect();
    if(!r.width||!r.height)continue;
    const drift=Math.abs(r.width-r.height);
    if(drift>.75){
      // Width is the canonical responsive dimension; derive height from it.
      el.style.setProperty('height',`${r.width}px`,'important');
      el.style.setProperty('min-height','0px','important');
      el.style.setProperty('max-height',`${r.width}px`,'important');
      el.dataset.circleCorrected=source;
    }else{
      el.style.removeProperty('max-height');
      delete el.dataset.circleCorrected;
    }
  }
}
function queueCircleAudit(source='turn'){
  requestAnimationFrame(()=>auditCircleGeometry(source));
  // A second pass catches late layout changes from viewport/speech/transition reflow.
  setTimeout(()=>auditCircleGeometry(source+'-settled'),80);
}

 else if(action.startsWith('maker-kind:')){state.maker=newMakerDraft(action.split(':')[1]);return render()}

 else if(action.startsWith('maker-carrier:')){const d=ensureMaker(),id=action.split(':')[1],old=d.ballCarrier;d.ballCarrier=id;if(old&&old!==id&&old!=='jayden'&&d.jobs[old]?.action==='run'){d.jobs[old]={...d.jobs[old],action:'stay',target:null,routeId:null,path:[{...makerFormationPos(old)}]}}if(id==='jayden')d.jobs.jayden={...d.jobs.jayden,action:'run',target:null,routeId:d.jobs.jayden.routeId||'straight',path:makerRoutePath('jayden',d.jobs.jayden.routeId||'straight')};else d.jobs.jayden={...d.jobs.jayden,action:'handoff',target:id,routeId:null,path:[{...makerFormationPos('jayden')}]};d.jobs[id]={...d.jobs[id],action:'run',routeId:d.jobs[id].routeId||'straight',path:makerRoutePath(id,d.jobs[id].routeId||'straight')};d.selected=id;d.check=null;return render()}
 else if(action.startsWith('maker-receiver:')){const d=ensureMaker(),id=action.split(':')[1],old=d.receiver;d.receiver=id;if(old&&old!==id&&d.jobs[old]?.action==='catch'){d.jobs[old]={...d.jobs[old],action:'stay',target:null,routeId:null,path:[{...makerFormationPos(old)}]}}d.jobs[d.passer]={...d.jobs[d.passer],action:'throw',target:id,routeId:null,path:[{...makerFormationPos(d.passer)}]};d.jobs[id]={...d.jobs[id],action:'catch',routeId:d.jobs[id].routeId||'straight',path:makerRoutePath(id,d.jobs[id].routeId||'straight')};d.selected=id;d.check=null;return render()}
 else if(action.startsWith('maker-job:')){const d=ensureMaker(),a=action.split(':')[1],j=d.jobs[d.selected],st=makerFormationPos(d.selected);j.action=a;j.target=null;if(['run','move','catch'].includes(a)&&!j.routeId){j.routeId='straight';j.path=makerRoutePath(d.selected,j.routeId)}if(a==='block'){j.routeId=null;j.path=[{...st}]}if(a==='stay'){j.routeId=null;j.path=[{...st}]}d.check=null;return render()}
 else if(action.startsWith('maker-route:')){const d=ensureMaker(),id=action.split(':')[1],j=d.jobs[d.selected],st=makerFormationPos(d.selected);if(id==='stay'){j.routeId=null;j.path=[{...st}]}else{j.routeId=id;j.path=makerRoutePath(d.selected,id)}d.drawMode=false;d.check=null;return render()}
 else if(action.startsWith('maker-target:')){const d=ensureMaker(),id=action.split(':')[1],j=d.jobs[d.selected];if(makerNeedsTarget(j.action)){j.target=id;if(j.action==='throw'){d.passer=d.selected;d.receiver=id;d.jobs[id].action='catch';d.jobs[id].routeId=d.jobs[id].routeId||'straight';d.jobs[id].path=makerRoutePath(id,d.jobs[id].routeId)}if(j.action==='handoff'){d.ballCarrier=id}d.check=null;return render()}return}
 else if(action==='maker-draw'){const d=ensureMaker();d.drawMode=!d.drawMode;return render()}
 else if(action==='maker-check'){const d=ensureMaker();d.check=validateMakerDraft(d);return render()}
 else if(action==='maker-watch'){const d=ensureMaker();d.check=validateMakerDraft(d);if(!d.check.ok)return render();render();return later(80,makerPreview)}
 else if(action==='maker-save'){saveMakerDraft();return}
 else if(action==='maker-reset'){state.maker=newMakerDraft(ensureMaker().kind);return render()}
 else if(action==='maker-random'){state.maker=randomMakerDraft();return render()}
 else if(action==='maker-try'){const d=ensureMaker(),id=d.savedId;if(id){clearRuntime();const primary=d.kind==='pass'?d.receiver:d.ballCarrier;if(primary&&state.data.roster.some(p=>p.id===primary)){state.playerId=primary;try{localStorage.setItem('mtf2-player',primary)}catch{}}state.game.play=id;state.game.state='READY';state.game.execution=null;state.game.result=null;state.screen='game';render();return speak(`${play(id).name}. Get ready.`)}}
 else if(action==='mute'){cancelSpeech();state.mute=!state.mute;storage.save();render()}
 else if(action==='preview-voice'){cancelSpeech();speak(`Hi ${player().name}. Watch your job, then show me what you learned.`)}
 else if(action==='advance-learning')advanceLearning();
 else if(action==='reset-rep'){clearRuntime();if(state.screen==='learning'&&state.learning){state.learning.challengePaused=false;state.feedback=null;state.learning.step='EXECUTE';render()}else if(state.screen==='game'){state.game.state='READY';state.game.execution=null;render()}}
 else if(action==='next-stage'){const L=state.learning;if(L.stage===1)startLearning(L.plid,3,'normal');else go('learn')}
 else if(action==='quick'){startRandomRep('quick')}
 else if(action==='quick-next'){startRandomRep(state.learning?.mode==='gameday'?'gameday':'quick')}
 else if(action==='gameday'){startRandomRep('gameday')}
 else if(action==='snap'){clearRuntime();state.game.state='EXECUTE';state.game.execution={mistakes:0};render()}
 else if(action==='next-down'){clearRuntime();state.game.state='CALL_PLAY';state.game.play=null;state.game.result=null;render()}
 else if(action==='save-team'){Object.assign(state.data.team,{name:$('#teamName').value,mascot:$('#mascot').value,logo:$('#logo').value,season:$('#season').value,division:$('#division').value,slogan:$('#slogan').value,primary:$('#primary').value,secondary:$('#secondary').value});storage.save();render()}
 else if(action==='save-roster')saveRosterFromCoach()
}
function startRandomRep(mode){
 const ids=state.data.assigned[player().id]||[];if(!ids.length)return;
 const index=(Date.now()+ids.length+player().num)%ids.length;
 startLearning(ids[index],3,mode)
}
function runSelfTests(){

  ok('Play logic table exists',typeof PLAY_LOGIC==='object'&&Object.keys(PLAY_LOGIC).length===4);
  ok('All plays validate',state.data.plays.every(pl=>validatePlayLogic(pl.id).ok));
  ok('Only Learn and Challenge flows remain',Object.keys(LEARNING_FLOW).join(',')==='1,3');
  ok('Learning screen renderer exists',typeof learning==='function');
  ok('Learn includes teaching and hands-on execution',LEARNING_FLOW[1].includes('WATCH')&&LEARNING_FLOW[1].includes('GUIDED')&&LEARNING_FLOW[1].includes('RELATIONSHIP')&&LEARNING_FLOW[1].includes('EXECUTE'));
  ok('Challenge starts set and goes straight to execution',LEARNING_FLOW[3].join('>')==='EXECUTE>FINISH>COMPLETE');
  ok('Run Right Christian learner target is Cameron',assignment('run-right','christian')?.relation?.target==='cameron');
  ok('Run Right Christian target is Cameron',assignment('run-right','christian')?.relation?.target==='cameron');
  ok('Run Left Christian target is Logan #70',assignment('run-left','christian')?.relation?.target==='left-blocker'&&relationshipText(assignment('run-left','christian'),1).includes('Logan #70'));
  ok('Power Right Christian target is Cameron',assignment('power-right','christian')?.relation?.target==='cameron');
  ok('Screen Christian follow target is Cameron slot',assignment('screen','christian')?.relation?.target==='cameron'&&relationshipText(assignment('screen','christian'),1).includes(rosterIdentity('cameron').name));
  ok('Runner focus target matches decision follow target where applicable',['christian','marcus'].every(pid=>['power-right','screen'].every(id=>learningFocusTarget(id,pid)===assignment(id,pid)?.decision?.correct)));
  ok('Logan base skin is neutral',renderPlayerDot('left-blocker',entityPos['left-blocker']).includes('player-dot team')&&!renderPlayerDot('left-blocker',entityPos['left-blocker']).includes('focus-target'));
  ok('Progress model has two completion stars',stars.toString().includes('raw>=3?2')&&playStageControls('run-right',2).includes('GAME READY'));
  ok('Drag helper exists',typeof dragLivePlayer==='function');
  ok('Game still has thumb stick markup',liveFieldMarkup('run-right',{context:'game',stage:3}).includes('data-thumbstick'));
  ok('Learn uses drag markup',liveFieldMarkup('run-right',{context:'learning',stage:1}).includes('data-input-mode="drag"'));
  ok('Buttons use durable delegated controls',typeof ensureDelegatedControls==='function');
  ok('Circle geometry audit exists',typeof queueCircleAudit==='function');
  ok('Run defenders flow toward play side',(()=>{const f=playFrames('run-right');return f[2].p['def-mid'].x>50&&f.at(-1).p['def-right'].y>f.at(-1).p.marcus.y})());
  ok('Power edge defender meets lead blocker',(()=>{const f=playFrames('power-right'),q=f.find(x=>x.event==='follow');return q&&positionDistance(q.p.cameron.x,q.p.cameron.y,q.p['def-right'])<9})());
  ok('Screen defense rushes then retraces',(()=>{const f=playFrames('screen'),drop=f.find(x=>x.event==='drop'),pass=f.find(x=>x.event==='pass'),catchf=f.find(x=>x.event==='catch-wait');return drop&&pass&&catchf&&pass.p['def-mid'].y>drop.p['def-mid'].y&&catchf.p['def-mid'].y<pass.p['def-mid'].y})());
  ok('Screen Learn separates catch from lead-blocker follow',(()=>{const old=state.playerId;state.playerId='christian';const m=liveFieldMarkup('screen',{context:'learning',stage:1}),qb=rosterIdentity('jayden');state.playerId=old;return m.includes('TRACE TO THE CATCH')&&m.includes(`WAIT FOR ${qb.name.toUpperCase()} #${qb.num}`)&&!m.includes('focus-target')})());
  ok('Screen narration uses editable lead-blocker identity',(()=>{const cam=rosterIdentity('cameron');return playNarration('screen',playFrames('screen').find(x=>x.event==='run-after-catch')).includes(`${cam.name} #${cam.num}`)})());
  ok('Coach roster editor exists',coachRosterEditor().includes('data-roster-name')&&coachRosterEditor().includes('data-roster-num')&&coachRosterEditor().includes('save-roster'));
  ok('Roster save handler exists',typeof saveRosterFromCoach==='function');
  ok('Runner objective uses editable Cameron identity',(()=>{const cam=rosterIdentity('cameron');return objectiveFor('run-right','christian').label.includes(`${cam.name.toUpperCase()} #${cam.num}`)})());
  ok('Learn trace path exists for every play',state.data.plays.every(pl=>tracePointsFor(pl.id).length>=2));
  ok('Execution has reset and Home controls',liveFieldMarkup('run-right',{context:'learning',stage:3}).includes('reset-rep')&&liveFieldMarkup('run-right',{context:'learning',stage:3}).includes('data-go="home"'));
  const savedScreenForNav=state.screen;state.screen='learning';const navShellTest=shell('<main></main>','learn',false);state.screen=savedScreenForNav;ok('Every non-home shell has persistent Home control',navShellTest.includes('class="brand-home-btn"')&&navShellTest.includes('data-go="home"')); 
  ok('Challenge miss pauses instead of auto-looping',finishLive.toString().includes('challengePaused=true')&&postRender.toString().includes('!state.learning?.challengePaused'));
  ok('Challenge shows trace path',liveFieldMarkup('run-right',{context:'learning',stage:3}).includes('live-trace'));
  ok('Learn requires ordered trace completion',liveTick.toString().includes('trace.next>=l.trace.points.length'));
  ok('Main Play shows trace path',liveFieldMarkup('run-right',{context:'game',stage:3}).includes('live-trace'));
  ok('Main Play execution requires trace completion',startLiveExecution.toString().includes("context==='game'"));
  ok('Screen pre-catch drag collision ignores rushing defenders',resolveDragPosition.toString().includes('screenRunnerPreCatch'));
  ok('Owned live ball is not rewritten by animation frames',applyFrame.toString().includes('liveRunnerOwnsBall'));
  ok('Screen trace is visually split at the catch',liveTracePathMarkup.toString().includes('screen-trace-pre')&&liveTracePathMarkup.toString().includes('screen-trace-post'));
  ok('Game trace does not claim no hints',!liveFieldMarkup('screen',{context:'game',stage:3}).includes('NO HINTS — RUN THE PLAY'));
  const box=document.createElement('pre');box.id='selftest';box.textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} — ${r.name}`).join('\n')+`\nTOTAL ${results.filter(r=>r.pass).length}/${results.length}`;document.body.appendChild(box);return results
}

function corePreflight(){
 const failures=[];
 if(typeof entityPos!=='object'||!entityPos.christian||!entityPos['def-mid'])failures.push('entityPos');
 if(!Array.isArray(DEFENDER_IDS)||DEFENDER_IDS.length!==3)failures.push('DEFENDER_IDS');
 if(typeof PLAY_LOGIC!=='object'||Object.keys(PLAY_LOGIC).length!==4)failures.push('PLAY_LOGIC');
 if(typeof STAGE_RULES!=='object')failures.push('STAGE_RULES');
 if(typeof render!=='function')failures.push('render');
 if(typeof learning!=='function')failures.push('learning renderer');
 try{for(const pl of state.data.plays){const v=validatePlayLogic(pl.id);if(!v.ok)failures.push('play:'+pl.id)}}catch(err){failures.push('play validation: '+(err?.message||err))}
 return [...new Set(failures)]
}
bindViewportSync();
const preflightFailures=corePreflight();
if(preflightFailures.length){
 cancelSpeech();
 app.innerHTML=`<main class="screen"><div class="notice"><b>Core build failed preflight.</b><br>${preflightFailures.join(', ')}<br><small>Build ${BUILD_ID}</small></div></main>`
}else{
 render();
 if(new URLSearchParams(location.search).get('selftest')==='1')runSelfTests()
}
